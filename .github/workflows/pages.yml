name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          mkdir -p _site/schema/0.1
          cp spec/schema/*.schema.json _site/schema/0.1/
          mkdir -p _site/examples/ambient-scribe-illustrative
          cp spec/examples/ambient-scribe-illustrative/overview.html \
            _site/examples/ambient-scribe-illustrative/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
